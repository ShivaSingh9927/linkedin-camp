# =============================================================================
# Production compose for the WORKER server (Hetzner ubuntu-4gb-hel1-5, 10.0.0.2)
# Runs:  backend-api  +  backend-worker  (same image, two commands)
# Connects to:  postgres / redis / ai-service on the DB server (10.0.0.4)
# Fronted by:   Hetzner LB11 -> 10.0.0.2:3001
# =============================================================================

# Cap container stdout/stderr logs so a chatty run can never fill the disk.
# Root cause of two prior 100%-disk outages: the default json-file driver has
# NO size limit, so backend-worker's log grew to 14GB and wedged the box.
# 50m x 5 files = 250MB max per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  backend-api:
    build: .
    image: linkedin-camp-backend:latest
    container_name: backend-api
    restart: unless-stopped
    logging: *default-logging
    command: ["sh", "-c", "xvfb-run -a node apps/backend/dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: 3001
      # This process launches Chromium only for the login flow (rare, one-per-
      # account). Bound it so a burst of concurrent logins can't stack browsers
      # on top of the worker's and push the box into swap. See worker notes below.
      BROWSER_LAUNCH_LIMIT: "4"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      EMAIL_FINDER_URL: ${EMAIL_FINDER_URL}
      EMAIL_FINDER_TOKEN: ${EMAIL_FINDER_TOKEN}
      GROQ_API: ${GROQ_API}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      POSTHOG_KEY: ${POSTHOG_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      OUTLOOK_EMAIL: ${OUTLOOK_EMAIL}
      OUTLOOK_APP_PASSWORD: ${OUTLOOK_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      # Sticky-per-account proxy fallback. Without these the container has no
      # PROXY env at all — every LinkedIn login + campaign run exits via the
      # Hetzner Helsinki public IP and LinkedIn instantly throws a device
      # challenge in Finnish. Same vars consumed by session-manager.service
      # and session-validator.service.
      DEFAULT_PROXY_SERVER: ${DEFAULT_PROXY_SERVER}
      DEFAULT_PROXY_PORT: ${DEFAULT_PROXY_PORT}
      DEFAULT_PROXY_USERNAME: ${DEFAULT_PROXY_USERNAME}
      DEFAULT_PROXY_PASSWORD: ${DEFAULT_PROXY_PASSWORD}
      CRM_ENCRYPTION_KEY: ${CRM_ENCRYPTION_KEY}
      SESSION_STORAGE_PATH: ${SESSION_STORAGE_PATH:-/app/sessions}
      INBOX_DIAG: ${INBOX_DIAG:-}
      CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY}
    # Bind the API only to the private-net IP so the public IP never exposes :3001.
    # The Hetzner LB reaches it at 10.0.0.2:3001 over the private network.
    ports:
      - "${PRIVATE_IP}:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Same volume backend-worker uses. The API writes to /app/sessions too
    # (SESSION_STORAGE_PATH above), and the login flow runs in THIS process —
    # so challenge-capture.service archives every unhandled LinkedIn challenge
    # screen (raw HTML + screenshot) here. Without the mount those landed on the
    # container's ephemeral layer and were destroyed on every deploy: 0 captures
    # survived. Those screens are rare and can't be summoned on demand, and they
    # are the only real material for teaching classifyPage to tell an app-approval
    # prompt from a phone verification from a captcha, so losing them is
    # expensive. Sharing one volume is safe — both services write per-user
    # subdirectories, and only one login runs per account at a time.
    volumes:
      - sessions_data:/app/sessions

  backend-worker:
    image: linkedin-camp-backend:latest
    container_name: backend-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend-api
    # xvfb-run gives Playwright a virtual display so headed-mode stealth works.
    command: ["sh", "-c", "xvfb-run -a node apps/backend/dist/worker-entry.js"]
    environment:
      NODE_ENV: production
      # Concurrency tuning, pinned for this box (8GB RAM / 4 vCPU).
      #  WORKER_CONCURRENCY  = campaign JOB slots. Parked jobs (waiting on pacing
      #    delays) are cheap, so 24 is safe — it does NOT mean 24 live browsers.
      #  BROWSER_LAUNCH_LIMIT = max SIMULTANEOUS Chromium windows (the real RAM/CPU
      #    governor; read-only jobs never take a permit). Code default is 16, but
      #    16 x ~300MB ~= 4.8GB overflows this box's free RAM into swap and pegs
      #    4 cores. 12 x ~300MB ~= 3.6GB fits with headroom. Raise toward 16 only
      #    after watching `docker stats` show sustained RAM+swap headroom.
      WORKER_CONCURRENCY: "24"
      BROWSER_LAUNCH_LIMIT: "12"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      EMAIL_FINDER_URL: ${EMAIL_FINDER_URL}
      EMAIL_FINDER_TOKEN: ${EMAIL_FINDER_TOKEN}
      GROQ_API: ${GROQ_API}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      POSTHOG_KEY: ${POSTHOG_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      OUTLOOK_EMAIL: ${OUTLOOK_EMAIL}
      OUTLOOK_APP_PASSWORD: ${OUTLOOK_APP_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      # Sticky-per-account proxy fallback. Without these the container has no
      # PROXY env at all — every LinkedIn login + campaign run exits via the
      # Hetzner Helsinki public IP and LinkedIn instantly throws a device
      # challenge in Finnish. Same vars consumed by session-manager.service
      # and session-validator.service.
      DEFAULT_PROXY_SERVER: ${DEFAULT_PROXY_SERVER}
      DEFAULT_PROXY_PORT: ${DEFAULT_PROXY_PORT}
      DEFAULT_PROXY_USERNAME: ${DEFAULT_PROXY_USERNAME}
      DEFAULT_PROXY_PASSWORD: ${DEFAULT_PROXY_PASSWORD}
      CRM_ENCRYPTION_KEY: ${CRM_ENCRYPTION_KEY}
      SESSION_STORAGE_PATH: ${SESSION_STORAGE_PATH:-/app/sessions}
      INBOX_DIAG: ${INBOX_DIAG:-}
      CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY}
    # Local sessions volume (transitional — replaced by object storage in Phase 2).
    volumes:
      - sessions_data:/app/sessions
    # Chromium needs more shm than the 64MB default or pages will randomly crash.
    shm_size: 1gb

volumes:
  sessions_data:
