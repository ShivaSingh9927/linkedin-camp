# SearXNG configuration for Qampi lead discovery.
#
# This instance is NOT a public search page. It is an internal JSON API on the
# db box's docker network, reachable only by research-agent — no published
# port, no user-facing UI traffic.
#
# Why it exists: it replaces scraping a rendered Yahoo SERP with Lightpanda.
# Measured on this box 2026-09-22, same query:
#     Yahoo + Lightpanda   ~7 profiles/page,  ~5s,  a browser process per page
#     SearXNG              20 profiles/page,  ~400ms,  113MB / 0.13% CPU total
# Pages are disjoint (58 distinct profiles over 3 pages, zero page1/page2
# overlap), so depth is real.
#
# `secret_key` below stays the literal placeholder on purpose. SearXNG reads the
# real value from the environment — searx/settings_defaults.py declares
# `'secret_key': SettingsValue(str, environ_name='SEARXNG_SECRET')`, and the env
# var wins over the file. (The image entrypoint also has a sed, but it
# substitutes a RANDOM value and does not touch a mounted settings file, so it
# is not the mechanism here.) Never put the real secret in this file — it is
# committed.

use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  # The limiter is bot protection for public instances. This one is private to
  # the docker network, and the limiter would only throttle our own service.
  limiter: false
  image_proxy: false

search:
  # json is what research-agent consumes; it is NOT enabled by default.
  formats:
    - html
    - json
  # Engines we query are public search engines. Keep the default safe-search
  # posture rather than widening it.
  safe_search: 0
  # Upstream engines are the slow part; fail the slow ones rather than making
  # the caller wait for a straggler.
  max_request_timeout: 6.0

outgoing:
  # Kept short on purpose. Engines that refuse us (brave and duckduckgo both
  # did, within seconds of a cold start) otherwise dominate latency: the first
  # cold query took 6s waiting on them, versus ~400ms once SearXNG had marked
  # them suspended. They stay ENABLED so they can recover on their own; the
  # timeout just stops them holding up the ones that answer.
  request_timeout: 3.0
  max_request_timeout: 5.0
  pool_connections: 20
  pool_maxsize: 10

valkey:
  # Share the Redis already running on this box instead of adding the Valkey
  # sidecar the upstream compose template ships — they speak the same protocol.
  # Key name is `valkey`, not `redis`: the latter still works but logs a
  # DeprecationWarning on every boot.
  url: redis://redis:6379/3
