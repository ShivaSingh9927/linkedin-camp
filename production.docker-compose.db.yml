# =============================================================================
# Production compose for the DB/AI server (Hetzner qampi-db-01, 10.0.0.4)
# Runs:  postgres  +  redis  +  ai-service
# All ports bound to the private-net IP — never exposed on the public IP.
# Public access is also blocked by ufw + Hetzner Cloud Firewall (Phase 3).
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PRIVATE_IP}:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # No password — Redis only listens on the private 10.0.0.4 IP and is
    # firewalled. Authoritative production state; do not re-introduce a
    # password without rotating it in every consumer's env at the same time.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PRIVATE_IP}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai-service
    image: linkedin-camp-ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Cloudflare AI Gateway (BYOK routes to OpenRouter/DeepSeek/Groq)
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL}
      CF_AIG_TOKEN: ${CF_AIG_TOKEN}
      CF_BYOK_ALIAS_OPENROUTER: ${CF_BYOK_ALIAS_OPENROUTER:-qampi-openrouter}
      CF_BYOK_ALIAS_DEEPSEEK: ${CF_BYOK_ALIAS_DEEPSEEK:-qampi-deepseek-v4-flash}
      CF_BYOK_ALIAS_GROQ: ${CF_BYOK_ALIAS_GROQ:-}
      # Direct DeepSeek fallback (used only if CF gateway env vars are missing)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Provider direct keys (some agents may use these via Cloudflare BYOK)
      GROQ_API: ${GROQ_API}
      # Model selection: 'test' (free OpenRouter) or 'production'
      AI_MODE: ${AI_MODE:-production}
      # Hard request timeout on every LLM call (seconds)
      LLM_HTTP_TIMEOUT_SECONDS: ${LLM_HTTP_TIMEOUT_SECONDS:-60}
      # Redis for strategy cache (24h TTL, survives container restart)
      REDIS_URL: redis://redis:6379
      # Sentry — same DSN as backend; events tagged service=ai-service
      SENTRY_DSN: ${SENTRY_DSN}
      NODE_ENV: ${NODE_ENV:-production}
      # CORS allowlist (ai-service is on private IP so this is defense-in-depth)
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.qampi.com,https://qampi.com,https://www.qampi.com}
      # Research-agent sidecar (Lightpanda-driven competitor scraping). Same
      # compose network, so we reach it by service name.
      RESEARCH_AGENT_URL: http://research-agent:8002
      RESEARCH_AGENT_TIMEOUT: 180
    ports:
      - "${PRIVATE_IP}:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Internal metasearch API for lead discovery. No published port — only
  # research-agent talks to it, over the compose network. Replaces a rendered
  # Yahoo scrape with a JSON API: 20 profiles/page in ~400ms instead of ~7 in
  # ~5s, and no browser process at all.
  searxng:
    image: docker.io/searxng/searxng:2026.9.21-49064747a
    container_name: searxng
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # SearXNG reads secret_key from this env var directly (settings_defaults
      # declares environ_name='SEARXNG_SECRET'), so the committed settings file
      # keeps a placeholder and the real value never enters git.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-env-production}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./apps/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  research-agent:
    build:
      context: ./apps/research-agent
    image: linkedin-camp-research-agent:latest
    container_name: research-agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL}
      CF_AIG_TOKEN: ${CF_AIG_TOKEN}
      CF_BYOK_ALIAS_DEEPSEEK: ${CF_BYOK_ALIAS_DEEPSEEK:-qampi-deepseek-v4-flash}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8002
      # Lightpanda + LLM synth budget. The hard deadline below caps the whole
      # /research/competitive-landscape call regardless.
      LIGHTPANDA_TIMEOUT_MS: 45000
      RESEARCH_HARD_DEADLINE_MS: 150000
      RESEARCH_MAX_COMPETITORS: 4
      # people-serp: concurrent Lightpanda renders on this box. Rendering is
      # CPU-bound and Postgres lives here too, so this cap protects the DB.
      # Size it from nproc rather than raising it blind.
      SERP_MAX_CONCURRENT: ${SERP_MAX_CONCURRENT:-2}
      # Primary search backend. Yahoo-via-Lightpanda stays wired as the
      # fallback: the two fail independently, so keeping both is the only
      # redundancy we actually have (see the single-engine note in people-serp).
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Only the engines measured to answer from this box. See the probe table
      # in people-serp.js before changing this.
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-google,yahoo}
      SERP_CACHE_TTL_SECONDS: ${SERP_CACHE_TTL_SECONDS:-604800}
      # Cache the landscape effectively forever — the user's positioning + their
      # competitor list rarely shifts week-to-week, and a "refresh strategy"
      # action flows force_regenerate=true through which bypasses this anyway.
      RESEARCH_CACHE_TTL_SECONDS: 31536000
    ports:
      - "${PRIVATE_IP}:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  redis_data:
